name: windows-build-script

# Exercises build.ps1 end to end: master pushes, nightly, and on demand. Pull
# requests are covered by the slim tier in pr.yml -- see the comment at the top
# of that file for why no required check may live in a path-filtered workflow.

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:

concurrency:
  # Include github.event_name so a scheduled run and a push to master (which
  # share github.ref == refs/heads/master) land in separate groups and do not
  # cancel each other. Without it, a nightly firing while a master-push build is
  # still running cancels it, or vice versa.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-headless:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build (headless)
        shell: pwsh
        run: .\build.ps1 -Headless -InstallPrereqs
