name: asan-loop-2732

# Throwaway (#2732, now #2700): never merge. Loops the setuptdcs_colin27_patchelc net on the same
# mac runner/Qt as mac-gui-regression, once under AddressSanitizer and once plain as a
# control for the base crash rate.

on:
  push:
    branches:
      - claude/scirun-2732-ci-asan
  workflow_dispatch:
    inputs:
      max-passes:
        description: Passes per variant
        default: '8'
      max-hits:
        description: Stop a variant after this many failing passes
        default: '3'

concurrency:
  # Per-commit, so a follow-up push doesn't cancel a leg still running.
  group: asan-loop-2732-${{ github.sha }}
  cancel-in-progress: true

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        # #2700 nets, with and without #2818 (dc99ffb53 + 529ae2cfa screenshot retry), which this branch carries.
        code: [master, fix]
    runs-on: macOS-latest
    timeout-minutes: 355
    env:
      LOOP_MAX_PASSES: ${{ inputs.max-passes || '8' }}
      LOOP_MAX_HITS: ${{ inputs.max-hits || '3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          setup-python: 'true'
          install-deps: true

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: Checkout SCIRunTestData
        uses: actions/checkout@v6
        with:
          repository: CIBC-Internal/SCIRunTestData
          path: SCIRunTestData

      - name: Restore master's copy of the #2818 files
        if: ${{ matrix.code == 'master' }}
        run: |
          git checkout origin/master -- src/Interface/Application/ModuleWidget.cc \
            src/Interface/Application/ModuleOptionsDialogConfiguration.cc \
            src/Interface/Modules/Base/ModuleDialogGeneric.h \
            src/Interface/Modules/Render/ViewScene.cc src/Interface/Modules/Render/ViewScene.h
          git status --short

      - name: Build
        shell: bash
        run: |
          set -eux
          export SCIRUN_ASAN=1
          CMD=(./build.sh)
          if command -v sccache >/dev/null 2>&1; then
            CMD+=("-DCMAKE_C_COMPILER_LAUNCHER=sccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")
          fi
          CMD+=("-DREGENERATE_MODULE_FACTORY_CODE:BOOL=OFF")
          CMD+=("-DQt_PATH=${QT_ROOT_DIR}" "-DSCIRUN_QT_MIN_VERSION=6.3.1")
          CMD+=("-DBUILD_TESTING:BOOL=ON" "-DSCIRUN_TEST_RESOURCE_DIR=${GITHUB_WORKSPACE}/SCIRunTestData")
          "${CMD[@]}"
          ls bin/SCIRun/lib | grep -c Interface

      - name: Loop the net
        shell: bash
        run: |
          bash scripts/ci-loop-nets.sh "$LOOP_MAX_PASSES" "$LOOP_MAX_HITS" "$GITHUB_WORKSPACE/loop-out" \
            src/ExampleNets/regression/Modules/createLatVol_new.srn5 \
            src/ExampleNets/regression/Modules/extractIsosurfaceManualRange.srn5 \
            src/ExampleNets/regression/Renderer/tensorOrders.srn5 \
            src/ExampleNets/regression/Renderer/widgetFeedbackTest.srn5 \
            src/ExampleNets/regression/Modules/vsBars.srn5 \
            src/ExampleNets/regression/ImportExport/colorMapXml.srn5 \
            src/ExampleNets/regression/Renderer/vectorMagnitude.srn5 \
            src/ExampleNets/regression/Renderer/embb2.srn5 \
            src/ExampleNets/regression/Renderer/rainbowBall.srn5 \
            src/ExampleNets/regression/Modules/calcFieldData1.srn5 \
            src/ExampleNets/regression/Modules/calcFieldData3.srn5 \
            src/ExampleNets/regression/Modules/convertFieldBasis.srn5 \
            src/ExampleNets/regression/Modules/extractsimpleisosurf.srn5 \
            src/ExampleNets/regression/Renderer/colorMap.srn5 \
            src/ExampleNets/regression/Renderer/rescaleColorMap.srn5 \
            src/ExampleNets/regression/Modules/setuptdcs_colin27_patchelc.srn5

      - name: Collect macOS crash reports
        if: always()
        run: |
          sleep 10
          mkdir -p "$GITHUB_WORKSPACE/loop-out/crash-reports"
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$d" ] && cp "$d"/SCIRun*.ips "$GITHUB_WORKSPACE/loop-out/crash-reports/" 2>/dev/null
          done
          echo "collected $(ls -1 "$GITHUB_WORKSPACE/loop-out/crash-reports" | wc -l) crash report(s)"
        continue-on-error: true

      - name: Upload loop output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loop-2700-${{ matrix.code }}
          path: loop-out
          retention-days: 14
