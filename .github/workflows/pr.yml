name: pr

# Slim, always-triggered PR tier.
#
# Two rules keep this workflow both cheap and mergeable:
#
#  1. No `paths-ignore` on `on:`. A workflow suppressed by a path filter never
#     reports its checks at all, so a *required* context stays Pending forever
#     and the pull request can never merge. A job that runs and is skipped by an
#     `if:` reports "skipped", which branch protection counts as passing. Path
#     filtering therefore happens at the job level below, never at `on:`.
#
#  2. `ci-gate` is the only context that should be marked required in branch
#     protection. It always runs, so it can always report, and it mirrors the
#     result of the builds it depends on. Requiring the nested `<job> / build`
#     contexts directly re-creates the problem in rule 1 as soon as one of them
#     is filtered or renamed.
#
# Within this workflow there are two tiers. Three Linux jobs -- linux-gui (Qt5),
# linux-gui-qt6 and linux-unit-tests -- run on every non-docs PR and are what
# ci-gate normally waits on. mac-gui and windows-gui-qt6 join them only when the
# PR touches build-system, CI, or platform-specific paths (see `platform_risk`
# below). Whether linux-gui still earns its slot now that linux-gui-qt6 covers
# the GUI path is an open question, not a settled one.
#
# The full matrix (all the mac-headless-*, windows-gui-python-*, regression and
# coverage variants) lives in ccpp.yml / mac.yml / windows.yml /
# regression-tests.yml / windows-build-script.yml and runs on master pushes and
# nightly -- not on every pull request. Use the `workflow_dispatch` trigger on
# those workflows to run the full matrix against a risky branch on demand.

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      platform_risk: ${{ steps.filter.outputs.platform_risk }}
    steps:
      - name: Classify changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh pr view "${{ github.event.pull_request.number }}" \
                    --repo "${{ github.repository }}" \
                    --json files --jq '.files[].path')

          echo "Changed files:"
          echo "$files"

          count=$(printf '%s\n' "$files" | grep -c . || true)

          # Fail safe towards building: an empty list, or one long enough to have
          # been truncated by the API, must not be mistaken for a docs-only PR.
          if [ "$count" -eq 0 ] || [ "$count" -ge 100 ]; then
            docs_only=false
          elif printf '%s\n' "$files" | grep -qvE '^docs/'; then
            docs_only=false
          else
            docs_only=true
          fi

          # Does this PR touch anything that can behave differently per platform?
          # Build system, CI, vendored externals, and the macOS bundle glue. C++
          # under src/ that compiles on gcc against Qt6 is not in this set -- that
          # is the bet this filter makes, and windows.yml/mac.yml on master push
          # plus the nightly matrix are what catch it when the bet is wrong.
          #
          # Only the two top-level CMakeLists count: those hold the APPLE/WIN32
          # blocks. Nested ones are source lists, and matching them would drag
          # every new module into the full matrix for no reason.
          if [ "$count" -eq 0 ] || [ "$count" -ge 100 ]; then
            platform_risk=true
          elif printf '%s\n' "$files" | grep -qE '^(Superbuild/|\.github/|CMake/|src/Externals/|src/Main/)|^(src/)?CMakeLists\.txt$|\.cmake$|^build\.(sh|ps1)$'; then
            platform_risk=true
          else
            platform_risk=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "platform_risk=$platform_risk" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
          echo "platform_risk=$platform_risk"

  linux-gui:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      qt-version: ''
      variant: gui
      build-with-python: true

  # Qt6 on Linux. Every other Linux job here and in ccpp.yml autodetects
  # qtbase5-dev, so before this job the only Qt6 compile coverage anywhere was
  # mac-gui and windows-gui-qt6 -- the two slowest, scarcest runners. Pairing it
  # with linux-unit-tests is what lets those two leave the always-on set below.
  linux-gui-qt6:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      qt-version: '6.3.*'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true

  # mac and windows run only when the PR touches something that can diverge by
  # platform. They stay in ci-gate's `needs`, so when they do run the gate waits
  # on them exactly as before; when they are skipped, branch protection counts
  # that as passing and the gate falls through to the two Linux jobs.
  #
  # They are here rather than always-on because ci-gate is a *strict* required
  # check: every merge to master invalidates every other PR and re-runs all of
  # this. windows-gui-qt6 alone is 104-139 min against ~63 for linux-gui-qt6,
  # and macOS-latest is capped at 5 concurrent jobs repo-wide.
  mac-gui:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.platform_risk == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-latest
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunMacInstaller

  windows-gui-qt6:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.platform_risk == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '6.3.*'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunWindowsInstaller_qt6

  # Unit tests. The ctest step in reusable-build.yml carries
  # `continue-on-error: true`, so a failing test does NOT fail this job today --
  # master currently has 4 failing unit suites plus a large body of failing
  # .Test.ImportNetwork.* cases. What this job does gate on is the build: test
  # code that no longer compiles will fail the job, and hence ci-gate. The test
  # results themselves are visible in the log and the uploaded artifact.
  #
  # Once the outstanding failures are fixed, drop `continue-on-error` from the
  # "Run unit tests" steps in reusable-build.yml and this becomes a real gate
  # with no change needed here.
  linux-unit-tests:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: headless
      build-testing: true
      run-unit-tests: true

  # The single required check. `if: always()` is what lets it report even when
  # every build above was skipped, which is the case that unblocks docs-only PRs.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, linux-gui, linux-gui-qt6, mac-gui, windows-gui-qt6, linux-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Report upstream results
        run: |
          echo "changes:          ${{ needs.changes.result }}"
          echo "linux-gui:        ${{ needs.linux-gui.result }}"
          echo "linux-gui-qt6:    ${{ needs.linux-gui-qt6.result }}"
          echo "mac-gui:          ${{ needs.mac-gui.result }}"
          echo "windows-gui-qt6:  ${{ needs.windows-gui-qt6.result }}"
          echo "linux-unit-tests: ${{ needs.linux-unit-tests.result }}"

      - name: Fail if any required build failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more required builds did not succeed."
          exit 1

      - name: Pass
        run: echo "All required builds succeeded or were skipped."
