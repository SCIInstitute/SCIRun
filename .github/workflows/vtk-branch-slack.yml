name: vtk-branch-slack

# Slack notification when a build goes red on a VTK branch (#2681). Those
# branches are not master, so nightly-slack.yml ignores them.
#
# workflow_run workflows run from the DEFAULT branch's copy of the file, which
# is what makes this reach refactor_add_vtk without merging anything into it.
# It also means this cannot be exercised from a PR.
#
# Requires the SLACK_WEBHOOK_URL secret, as nightly-slack.yml does.

on:
  workflow_run:
    workflows:
      - linux-build
      - windows-build
      - windows-build-script
      - mac-build
    types:
      - completed

permissions:
  actions: read      # gh run list, for the red-streak count
  contents: read

jobs:
  notify:
    # Failures only; green would be noise people mute. nightly-slack.yml filters
    # to `schedule`, so no run can match both.
    #
    # pull_request as well as push: mac.yml on refactor_add_vtk has only a
    # pull_request trigger, so push alone could never report mac -- the one
    # platform with no local coverage. #2681 specifies push only.
    if: >-
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'pull_request') &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      # Matched here rather than in `on:` because workflow filter patterns are
      # case-sensitive with no regex. Heuristic both ways, which is fine for a
      # notifier: a stray match costs one Slack line, a miss costs one.
      - name: Is this a VTK branch?
        id: vtk
        env:
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # tr, not ${WF_BRANCH,,}: that needs bash 4, and this is the only part
          # of the workflow anyone can test off-runner.
          case "$(printf '%s' "$WF_BRANCH" | tr '[:upper:]' '[:lower:]')" in
            *vtk*) is_vtk=true ;;
            *)     is_vtk=false ;;
          esac
          echo "is_vtk=$is_vtk" >> "$GITHUB_OUTPUT"
          echo "branch=${WF_BRANCH} is_vtk=${is_vtk}"

      - name: Build Slack payload
        if: steps.vtk.outputs.is_vtk == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          short_sha="${WF_SHA:0:9}"

          case "$WF_CONCLUSION" in
            failure)   emoji=":red_circle:";;
            cancelled) emoji=":black_circle:";;
            *)         emoji=":white_circle:";;
          esac

          # Nobody is watching these branches, so "red for N runs" is the part
          # that says new-breakage vs long-rotten. index() is the position of
          # the last success, i.e. the non-green count at the head.
          streak="$(gh run list --repo "$REPO" \
            --workflow "$WF_NAME" --branch "$WF_BRANCH" \
            --limit 30 --json conclusion \
            -q '[.[].conclusion | select(. != null and . != "")]
                | (index("success") // length)' 2>/dev/null || true)"

          detail="<${WF_URL}|View run> · \`${short_sha}\`"
          if [ -n "${streak:-}" ] && [ "$streak" -gt 1 ] 2>/dev/null; then
            detail="${detail} · red for ${streak} runs"
          fi

          text="${emoji} *${WF_NAME}* ${WF_CONCLUSION} on \`${WF_BRANCH}\`"$'\n'"${detail}"
          jq -n --arg t "$text" '{text: $t}' > payload.json
          echo "Payload:"
          cat payload.json

      - name: Post to Slack
        if: steps.vtk.outputs.is_vtk == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret is not set; skipping Slack post."
            exit 0
          fi
          curl -sSf -X POST -H 'Content-type: application/json' \
            --data @payload.json "$SLACK_WEBHOOK_URL"
