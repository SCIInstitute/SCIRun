name: windows-build

# Full windows matrix: master pushes, nightly, and on demand. Pull requests are
# covered by the slim tier in pr.yml -- see the comment at the top of that file
# for why no required check may live in a path-filtered workflow.

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:

concurrency:
  # event_name keeps schedule and master-push runs (same github.ref) from
  # cancelling each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-headless:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      variant: headless
      build-testing: true

  windows-gui-qt5:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '5.15.2'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunWindowsInstaller_qt5

  windows-gui-qt6:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '6.3.*'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunWindowsInstaller_qt6

  windows-gui-python-qt5:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '5.15.2'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunWindowsPythonInstaller_qt5

  windows-gui-python-qt6:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '6.3.*'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunWindowsPythonInstaller_qt6

  # ---------------------------------------------------------------------------
  # Windows Server 2025 image, built with Visual Studio 2026 (v145 toolset).
  # The windows-2025 label currently resolves to the 'windows-2025-vs2026' image,
  # which carries a single VS Enterprise 2026 install -- not a side-by-side VS
  # 2022. The older v143 toolset is present as a component of that install
  # (Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64), so '-T v143' is
  # available as an escape hatch if v145 needs to be bypassed.
  #
  # Kept in the nightly matrix rather than the PR tier (pr.yml) so a
  # VS-2026-specific break can't block pull requests. See issue #2449.
  #
  # allow-failure: our externals lag the toolchain -- the b2 bundled with Boost
  # 1.90 cannot bootstrap under VS 2026 at all (#2657), which the upgrade to
  # Boost 1.91 fixes (#2548). A toolchain we don't control should not turn the
  # whole nightly red in the meantime. These jobs still run and still report red
  # on their own. Drop the flag once these builds are green.
  # ---------------------------------------------------------------------------
  windows-2025-headless-vs2026:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2025
      cmake-generator: 'Visual Studio 18 2026'
      variant: headless
      build-testing: true
      allow-failure: true

  windows-2025-gui-qt6-vs2026:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2025
      cmake-generator: 'Visual Studio 18 2026'
      qt-version: '6.3.*'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunWindowsInstaller_qt6_vs2026
      allow-failure: true
