name: windows-build

# Full windows matrix: master pushes, nightly, and on demand. Pull requests are
# covered by the slim tier in pr.yml -- see the comment at the top of that file
# for why no required check may live in a path-filtered workflow.

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-headless:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      variant: headless
      build-testing: true

  windows-gui-qt5:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '5.15.2'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunWindowsInstaller_qt5

  windows-gui-qt6:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '6.3.*'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunWindowsInstaller_qt6

  windows-gui-python-qt5:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '5.15.2'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunWindowsPythonInstaller_qt5

  windows-gui-python-qt6:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '6.3.*'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunWindowsPythonInstaller_qt6
