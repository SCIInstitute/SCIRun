name: windows-build

# Full windows matrix: master pushes, nightly, and on demand. Pull requests are
# covered by the slim tier in pr.yml -- see the comment at the top of that file
# for why no required check may live in a path-filtered workflow.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:

concurrency:
  # event_name keeps schedule and master-push runs (same github.ref) from
  # cancelling each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-headless:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      variant: headless
      build-testing: true

  windows-gui-qt5:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '5.15.2'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunWindowsInstaller_qt5

  windows-gui-qt6:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '6.3.*'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunWindowsInstaller_qt6

  windows-gui-python-qt5:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '5.15.2'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunWindowsPythonInstaller_qt5

  windows-gui-python-qt6:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2022
      qt-version: '6.3.*'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunWindowsPythonInstaller_qt6

  # ---------------------------------------------------------------------------
  # Publish installers to a GitHub Release (issue #2398). Nightly on cron/master
  # push; a draft versioned release on a v* tag. Mac publishes to the same
  # releases from mac.yml.
  # ---------------------------------------------------------------------------
  publish-nightly:
    needs: [windows-gui-qt5, windows-gui-qt6, windows-gui-python-qt5, windows-gui-python-qt6]
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      channel: nightly

  publish-stable:
    needs: [windows-gui-qt5, windows-gui-qt6, windows-gui-python-qt5, windows-gui-python-qt6]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      channel: stable
  # Windows Server 2025 image, built with Visual Studio 2026 (v145 toolset).
  # windows-2025 (== windows-latest since June 2026) ships both VS 2022 and
  # VS 2026; selecting the 'Visual Studio 18 2026' generator exercises the newer
  # toolchain. Kept in the nightly matrix rather than the PR tier (pr.yml) so a
  # VS-2026-specific break can't block pull requests. See issue #2449.
  # ---------------------------------------------------------------------------
  windows-2025-headless-vs2026:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2025
      cmake-generator: 'Visual Studio 18 2026'
      variant: headless
      build-testing: true

  windows-2025-gui-qt6-vs2026:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: windows-2025
      cmake-generator: 'Visual Studio 18 2026'
      qt-version: '6.3.*'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunWindowsInstaller_qt6_vs2026
