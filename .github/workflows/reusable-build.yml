name: Reusable build

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      qt-version:
        required: false
        type: string
      qt-path:
        required: false
        type: string
      cmake-generator:
        # Windows only: the Visual Studio generator passed to CMake. Defaults to
        # VS 2022; set to 'Visual Studio 18 2026' for the windows-2025 image,
        # which ships VS 2026 (v145 toolset). Requires CMake >= 4.2.
        required: false
        type: string
        default: 'Visual Studio 17 2022'
      scirun-qt-min-version:
        required: false
        type: string
      prepare-packages:
        required: false
        type: boolean
        default: false
      variant:
        required: true
        type: string
      build-with-python:
        required: false
        type: boolean
        default: true
      with-ospray:
        required: false
        type: boolean
        default: false
      build-testing:
        required: false
        type: boolean
        default: false
      run-unit-tests:
        required: false
        type: boolean
        default: false
      run-smoke-test:
        required: false
        type: boolean
        default: false
      run-regression-tests:
        required: false
        type: boolean
        default: false
      coverage:
        required: false
        type: boolean
        default: false
      artifact-name:
        required: false
        type: string
      allow-failure:
        # Experimental build: still runs, still reports a red job, but doesn't
        # fail the run. continue-on-error is rejected on a job that calls a
        # reusable workflow, hence an input applied to the job in here.
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    continue-on-error: ${{ inputs.allow-failure }}
    permissions:
      checks: write
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Qt (if requested)
        if: ${{ inputs.qt-version != '' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt-version }}
          setup-python: 'true'
          install-deps: true

      - name: Print Qt dir
        run: echo "QT_ROOT_DIR=${QT_ROOT_DIR:-(unset)}"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Checkout SCIRunTestData
        if: ${{ inputs.run-regression-tests || inputs.coverage }}
        uses: actions/checkout@v6
        with:
          repository: CIBC-Internal/SCIRunTestData
          path: SCIRunTestData

      - name: Prepare (linux)
        if: ${{ startsWith(inputs.runner, 'ubuntu') || inputs.prepare-packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-common-dev libgl1-mesa-dev mesa-utils-extra libglapi-mesa ninja-build qt5-qmake qtbase5-dev libqt5opengl5-dev libqt5svg5-dev xorg-dev libglu1-mesa-dev || true

      - name: Build (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        # No -j is passed on purpose: build.sh auto-detects a job count from the
        # runner's cores and RAM (see detect_parallel_jobs there) and echoes it,
        # so this stays correct across the 3-core arm64 images, the 4-core Intel
        # and Linux ones, and any self-hosted runner added later (#2617).
        # Before that detection existed these builds ran fully serial.
        run: |
          set -eux
          CMD=(./build.sh)
          CMD+=("-DCMAKE_C_COMPILER_LAUNCHER=sccache")
          CMD+=("-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")
          # Default ON deletes the generated factory sources after each build, so every
          # later `make` relinks up to SCIRun.app and re-runs its macdeployqt POST_BUILD
          # chain -- 4x in the mac package step. Only helps incremental local builds
          # pick up new .module files; CI is always clean. See #2664.
          CMD+=("-DREGENERATE_MODULE_FACTORY_CODE:BOOL=OFF")
          # Variant-specific flags
          if [ "${{ inputs.variant }}" = "gui" ]; then
            # Pass Qt path (from installer or explicit), and set SCIRUN_QT_MIN_VERSION appropriately
            if [ "${{ inputs.qt-version }}" != "" ]; then
              CMD+=("-DQt_PATH=\"${QT_ROOT_DIR}\"")
            elif [ "${{ inputs.qt-path }}" != "" ]; then
              CMD+=("-DQt_PATH=\"${{ inputs.qt-path }}\"")
            else
              # try to auto-detect on Debian/Ubuntu runners
              if command -v dpkg >/dev/null 2>&1; then
                QT_DET=$(dpkg -L qtbase5-dev 2>/dev/null | head -n 1 || true)
                if [ "${QT_DET}" != "" ]; then
                  CMD+=("-DQt_PATH=\"${QT_DET}\"")
                else
                  echo "Warning: qtbase5-dev files not found via dpkg"
                fi
              else
                echo "No Qt path provided and qt-version empty; proceeding without explicit Qt path"
              fi
            fi

            # Determine SCIRUN_QT_MIN_VERSION
            if [ "${{ inputs.scirun-qt-min-version }}" != "" ]; then
              CMD+=("-DSCIRUN_QT_MIN_VERSION=\"${{ inputs.scirun-qt-min-version }}\"")
            else
              if [ "${{ inputs.qt-version }}" != "" ]; then
                case "${{ inputs.qt-version }}" in
                  6.*) CMD+=("-DSCIRUN_QT_MIN_VERSION=\"6.3.1\"") ;;
                  5.*) CMD+=("-DSCIRUN_QT_MIN_VERSION=\"5.15.2\"") ;;
                  *) echo "Unknown qt-version format, not setting SCIRUN_QT_MIN_VERSION" ;;
                esac
              fi
            fi
          fi
          if [ "${{ inputs.variant }}" = "headless" ]; then
            CMD+=("-DBUILD_HEADLESS:BOOL=ON")
          fi
          if [ "${{ inputs.build-with-python }}" = "false" ]; then
            CMD+=("-DBUILD_WITH_PYTHON=OFF")
          fi
          if [ "${{ inputs.with-ospray }}" = "true" ]; then
            CMD+=("-DWITH_OSPRAY:BOOL=ON")
          fi
          if [ "${{ inputs.build-testing }}" = "true" ]; then
            CMD+=("-DBUILD_TESTING:BOOL=ON")
          fi
          if [ "${{ inputs.run-regression-tests }}" = "true" ] || [ "${{ inputs.coverage }}" = "true" ]; then
            CMD+=("-DSCIRUN_TEST_RESOURCE_DIR=${GITHUB_WORKSPACE}/SCIRunTestData")
          fi
          if [ "${{ inputs.coverage }}" = "true" ]; then
            # Debug build + Clang source-based coverage instrumentation.
            CMD+=("--debug" "-DENABLE_COVERAGE:BOOL=ON")
          fi
          # Join and run
          echo "Running: ${CMD[*]}"
          eval "${CMD[*]}"

      - name: Build (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Build arguments for cmake
          $cmakeArgs = @()
          $cmakeArgs += "-DCMAKE_C_COMPILER_LAUNCHER=sccache"
          $cmakeArgs += "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

          # As in the Linux/macOS step above: avoids a needless relink cascade. See #2664.
          $cmakeArgs += "-DREGENERATE_MODULE_FACTORY_CODE:BOOL=OFF"

          # Always use a Visual Studio generator on Windows to ensure MSVC flags are used.
          # The generator is an input (defaults to VS 2022) so the matrix can also build
          # with VS 2026 on the windows-2025 image.
          $cmakeArgs += '-G'
          $cmakeArgs += '${{ inputs.cmake-generator }}'
          $cmakeArgs += '-A'
          $cmakeArgs += 'x64'

          if ('${{ inputs.variant }}' -eq 'gui') {
            if ('${{ inputs.qt-version }}' -ne '') {
              $qtPath = $env:QT_ROOT_DIR
              if (-not $qtPath) { $qtPath = $env:Qt5_Dir }
              if (-not $qtPath) { $qtPath = $env:Qt6_Dir }
              if ($qtPath) { $cmakeArgs += "-DQt_PATH=$qtPath" } else { Write-Host "Warning: Qt installer ran but QT path not found in env" }

              if ('${{ inputs.scirun-qt-min-version }}' -ne '') {
                $cmakeArgs += "-DSCIRUN_QT_MIN_VERSION=${{ inputs.scirun-qt-min-version }}"
              } else {
                if ('${{ inputs.qt-version }}' -like '6.*') { $cmakeArgs += "-DSCIRUN_QT_MIN_VERSION=6.3.1" }
                elseif ('${{ inputs.qt-version }}' -like '5.*') { $cmakeArgs += "-DSCIRUN_QT_MIN_VERSION=5.15.2" }
              }
            } elseif ('${{ inputs.qt-path }}' -ne '') {
              $cmakeArgs += "-DQt_PATH=${{ inputs.qt-path }}"
            } else {
              Write-Host "No Qt path provided and qt-version empty; proceeding without explicit Qt path"
            }
          }

          if ('${{ inputs.variant }}' -eq 'headless') { $cmakeArgs += "-DBUILD_HEADLESS:BOOL=ON" }
          if ('${{ inputs.build-with-python }}' -eq 'false') { $cmakeArgs += "-DBUILD_WITH_PYTHON=OFF" }
          if ('${{ inputs.with-ospray }}' -eq 'true') { $cmakeArgs += "-DWITH_OSPRAY:BOOL=ON" }
          if ('${{ inputs.build-testing }}' -eq 'true') { $cmakeArgs += "-DBUILD_TESTING:BOOL=ON" }
          if ('${{ inputs.run-regression-tests }}' -eq 'true') { $cmakeArgs += "-DSCIRUN_TEST_RESOURCE_DIR=$env:GITHUB_WORKSPACE/SCIRunTestData" }

          # Prepare build directory (use bin/ to match build.ps1, build.sh, the
          # docs, and the Unix/macOS jobs — keeps the build tree identical across
          # platforms so the package/test/upload steps below share one path.)
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Push-Location bin

          # Run CMake configure
          $cmakeExe = 'cmake'
          $cmakeArgsFull = $cmakeArgs + @('-S','../Superbuild','-B','.')
          Write-Host "Configuring: $cmakeExe $($cmakeArgsFull -join ' ')"
          & $cmakeExe @cmakeArgsFull

          # Build (Release) using cmake --build
          Write-Host "Building with cmake --build . --config Release --parallel"
          & cmake --build . --config Release --parallel

          Pop-Location

      - name: Show sccache statistics (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          "${SCCACHE_PATH}" --show-stats

      - name: Show sccache statistics (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: '& $env:SCCACHE_PATH --show-stats'

      - name: Smoke test - executable loads and runs (Unix)
        if: ${{ inputs.run-smoke-test && runner.os != 'Windows' }}
        working-directory: bin/SCIRun
        # A successful build does NOT prove the binary can start. The dynamic loader
        # resolves linked libraries at load time, before main, so a reference to a
        # symbol the host OS lacks links cleanly and only aborts on execution.
        # Actually running the executable is what catches that class of failure;
        # --help suffices, because the loader has already resolved every dependency
        # by the time main runs, and --help routes to ConsoleApplication (see
        # src/Main/scirunMain.cc) so no window server is needed.
        #
        # Deliberately NO continue-on-error: unlike the test steps below, this step
        # must be able to fail the job, or it gates nothing.
        run: |
          set -eux
          # SCIRun_test is the unbundled executable, built on APPLE only
          # (src/Main/CMakeLists.txt); other platforms build SCIRun directly.
          if [ -x ./SCIRun_test ]; then
            APP=./SCIRun_test
          elif [ -x ./SCIRun ]; then
            APP=./SCIRun
          else
            echo "No SCIRun executable found in $(pwd)" >&2
            ls -la
            exit 1
          fi
          "$APP" --help

      - name: Package (optional - Unix/macOS)
        if: ${{ inputs.artifact-name != '' && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -eux
          if [ -d bin/SCIRun ]; then
            pushd bin/SCIRun
            cmake -DBUILD_BUNDLE:BOOL=ON ../../src || true
            make -j3 || true
            make package || true
            # Repair package script (present in older mac workflow)
            if [ -f repair_package.sh ]; then
              chmod +x repair_package.sh || true
              ./repair_package.sh || true
            fi
            popd
          else
            echo "bin/SCIRun not found; attempting in bin"
            if [ -d bin ]; then
              pushd bin
              cmake -DBUILD_BUNDLE:BOOL=ON ../src || true
              make -j3 || true
              make package || true
              popd
            else
              echo "No packaging directory found; skipping package step"
            fi
          fi

      - name: Package (optional - Windows)
        if: ${{ inputs.artifact-name != '' && runner.os == 'Windows' }}
        shell: cmd
        run: |
          if exist bin\SCIRun (
            pushd bin\SCIRun
            cmake --build . --config Release --target package || echo Package target failed or produced no packages
            popd
          ) else (
            pushd bin
            cmake --build . --config Release --target package || echo Package target failed or produced no packages
            popd
          )

      - name: Run unit tests (Unix)
        if: ${{ inputs.run-unit-tests && runner.os != 'Windows' }}
        working-directory: bin/SCIRun
        run: |
          ctest --output-on-failure --timeout 300 -j4 -E "\.Test\.ExampleNetwork\." \
            --output-junit "$GITHUB_WORKSPACE/junit-unit.xml" \
            2>&1 | tee /tmp/unit-test-results.txt
        continue-on-error: true

      - name: Run regression tests (Unix)
        if: ${{ inputs.run-regression-tests && runner.os != 'Windows' }}
        working-directory: bin/SCIRun
        run: |
          ctest --output-on-failure --timeout 300 -j3 -R "\.Test\.ExampleNetwork\." \
            --output-junit "$GITHUB_WORKSPACE/junit-regression.xml" \
            2>&1 | tee /tmp/regression-test-results.txt
        continue-on-error: true

      - name: Clean up per-process regression settings (Unix)
        if: ${{ inputs.run-regression-tests && runner.os != 'Windows' }}
        run: |
          # Each regression process isolates its QSettings under
          # SCIRun5_regression_<pid>; remove the stores left behind.
          rm -f "$HOME"/Library/Preferences/com.sci-cibc-software.SCIRun5_regression_*.plist 2>/dev/null || true
          rm -f "$HOME"/.config/"SCI:CIBC Software"/SCIRun5_regression_*.conf 2>/dev/null || true
        continue-on-error: true

      - name: Run unit tests (Windows)
        if: ${{ inputs.run-unit-tests && runner.os == 'Windows' }}
        working-directory: bin/SCIRun
        shell: pwsh
        run: |
          ctest --output-on-failure --timeout 300 -j4 -C Release -E "\.Test\.ExampleNetwork\." `
            --output-junit "$env:GITHUB_WORKSPACE\junit-unit.xml" `
            2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\unit-test-results.txt"
        continue-on-error: true

      - name: Run regression tests (Windows)
        if: ${{ inputs.run-regression-tests && runner.os == 'Windows' }}
        working-directory: bin/SCIRun
        shell: pwsh
        run: |
          ctest --output-on-failure --timeout 300 -j3 -C Release -R "\.Test\.ExampleNetwork\." `
            --output-junit "$env:GITHUB_WORKSPACE\junit-regression.xml" `
            2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\regression-test-results.txt"
        continue-on-error: true

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always() && inputs.run-unit-tests
        with:
          name: "Unit Tests (${{ runner.os }} / ${{ inputs.variant }})"
          path: junit-unit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Publish regression test results
        uses: dorny/test-reporter@v1
        if: always() && inputs.run-regression-tests
        with:
          name: "Regression Tests (${{ runner.os }} / ${{ inputs.variant }})"
          path: junit-regression.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test logs (Unix)
        if: ${{ (inputs.run-unit-tests || inputs.run-regression-tests) && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ runner.os }}-${{ inputs.variant }}
          if-no-files-found: ignore
          path: |
            /tmp/unit-test-results.txt
            /tmp/regression-test-results.txt
            bin/SCIRun/Testing/Temporary/LastTest.log
            junit-unit.xml
            junit-regression.xml

      - name: Upload test logs (Windows)
        if: ${{ (inputs.run-unit-tests || inputs.run-regression-tests) && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ runner.os }}-${{ inputs.variant }}
          if-no-files-found: ignore
          path: |
            unit-test-results.txt
            regression-test-results.txt
            bin/SCIRun/Testing/Temporary/LastTest.log
            junit-unit.xml
            junit-regression.xml

      - name: Run tests + coverage report (macOS)
        if: ${{ inputs.coverage && runner.os == 'macOS' }}
        run: |
          # scripts/coverage.sh runs ctest with per-process profiling, merges
          # with llvm-profdata, and writes a text summary + HTML via llvm-cov.
          # No -R filter: cover both unit and regression tests.
          ./scripts/coverage.sh bin/SCIRun -- -j3 --timeout 300
        continue-on-error: true

      - name: Clean up per-process regression settings (coverage)
        if: ${{ inputs.coverage && runner.os == 'macOS' }}
        run: rm -f "$HOME"/Library/Preferences/com.sci-cibc-software.SCIRun5_regression_*.plist 2>/dev/null || true
        continue-on-error: true

      - name: Upload coverage report
        if: ${{ inputs.coverage && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ runner.os }}
          # `error`, not the default `warn`: the step above is continue-on-error
          # (tests legitimately fail), so a coverage.sh that produced nothing
          # otherwise reports success and silently uploads no artifact.
          if-no-files-found: error
          path: |
            bin/SCIRun/coverage/summary.txt
            bin/SCIRun/coverage/html

      - name: Upload installer (optional)
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            bin/SCIRun/SCIRun-*-Darwin.pkg
            bin/SCIRun/SCIRun-*-win64.exe
            bin/**/*.msi

