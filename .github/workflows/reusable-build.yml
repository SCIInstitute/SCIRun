# Warm-cache measurement commit for PR #2780 -- no functional change, just
# forces a new run to compare against the v5 cold run's timings.
name: Reusable build

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      qt-version:
        required: false
        type: string
      qt-path:
        required: false
        type: string
      cmake-generator:
        # Windows only: the Visual Studio generator passed to CMake. Defaults to
        # VS 2022; set to 'Visual Studio 18 2026' for the windows-2025 image,
        # which ships VS 2026 (v145 toolset). Requires CMake >= 4.2.
        required: false
        type: string
        default: 'Visual Studio 17 2022'
      scirun-qt-min-version:
        required: false
        type: string
      prepare-packages:
        required: false
        type: boolean
        default: false
      variant:
        required: true
        type: string
      build-with-python:
        required: false
        type: boolean
        default: true
      with-ospray:
        required: false
        type: boolean
        default: false
      build-testing:
        required: false
        type: boolean
        default: false
      run-unit-tests:
        required: false
        type: boolean
        default: false
      run-smoke-test:
        required: false
        type: boolean
        default: false
      run-regression-tests:
        required: false
        type: boolean
        default: false
      cache-externals:
        # POC (issue #2627/#2677 lineage): cache the Superbuild's compiled
        # externals (Externals/Build + Externals/Install + Externals/Stamp)
        # across runs, Linux-only for now. Opt-in per caller so it stays
        # scoped to the pr.yml jobs that now run on almost every PR (#2747)
        # instead of every reusable-build.yml caller at once.
        required: false
        type: boolean
        default: false
      coverage:
        required: false
        type: boolean
        default: false
      artifact-name:
        required: false
        type: string
      max-os-floor:
        # macOS only. The oldest OS this installer is meant to launch on. The
        # build step below measures what it ACTUALLY requires and warns on a
        # mismatch; it never fails the job, because the job cannot fix the
        # runner image it was handed.
        required: false
        type: string
        default: ''
      allow-failure:
        # Experimental build: still runs, still reports a red job, but doesn't
        # fail the run. continue-on-error is rejected on a job that calls a
        # reusable workflow, hence an input applied to the job in here.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        # Backstop for a hung step; GitHub's default of 360 let one burn 6h (#2731).
        # Slowest real job is ~156 min. Raise per caller if one needs longer.
        required: false
        type: number
        default: 240

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    continue-on-error: ${{ inputs.allow-failure }}
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Two prior attempts at this failed for opposite reasons: #2513 cached
      # only Install/+Stamp/ and captured 17-66 KB, because 20 of 23 externals
      # use INSTALL_COMMAND "" and their real artifacts live in Build/; #2576
      # cached the whole Externals/ tree across 13 mac+windows jobs and blew
      # the repo's 10 GB cache cap, so nothing ever stayed warm.
      #
      # v1 of this POC excluded Source/ on the theory that it's just a
      # reclonable checkout -- wrong: several externals (Zlib, SQLite, Teem,
      # Freetype, Cleaver2, and the header-only Eigen/GLM/SpdLog/Tetgen) point
      # their CMake consumers straight at Source/, never Build/ or Install/.
      # v2 cached the whole tree to fix that, and hit #2576's cap problem
      # again on a single job: ~2.77 GiB, almost all of it Boost's full
      # checkout (~180 submodules) under Source/Boost_external -- headers
      # SCIRun never reads from there (BoostExternal.cmake already copies them
      # into Install/include/boost) and libraries it only needs one part of:
      # SCI_BOOST_LIBRARY_DIR is hardcoded to Source/Boost_external/stage/lib.
      #
      # v3 tried excluding it with a bare `!bin/Externals/Source/Boost_external`
      # (no size change) and v4 tried the same with a trailing `/**` (also no
      # size change -- still 2.77 GiB both times). Root cause, confirmed via
      # actions/toolkit#713: actions/cache restores/saves with
      # `implicitDescendants: false`, so it never enumerates a directory's
      # contents to apply a negation against in the first place -- `!` exclude
      # patterns are simply inert here, no syntax fixes it.
      #
      # v5 drops negation entirely and lists Source/ subdirectories by name.
      # Per-external du from the v4 run (job 107602188201) showed exactly two
      # dominate: Boost_external (2.7 GiB, only stage/lib is ever read --
      # headers are already duplicated into Install/include/boost) and
      # Python_external (575 MiB; Linux does a real Python install, so nothing
      # under its Source/ is read at all -- that path is Windows-only in
      # PythonExternal.cmake). Libxml2_external (63 MiB) is also Install/-only
      # (confirmed by its logged Libxml2_DIR). All three are simply omitted;
      # everything else stayed in Source/ because it's genuinely read from
      # there (Zlib/SQLite/Teem/Freetype/Cleaver2 ship a vendored UseXxx.cmake
      # there; Eigen/GLM/SpdLog are header-only with their _DIR set straight to
      # SOURCE_DIR).
      #
      # Scoped to these 3 Linux jobs only (not the 13 mac+windows jobs #2576
      # tried to cover) is what keeps this under the cap now that most PRs
      # run only these jobs (#2747).
      - name: Compute externals cache key
        if: ${{ inputs.cache-externals }}
        id: ext-key
        shell: bash
        run: |
          if [ "${{ inputs.variant }}" = "headless" ]; then
            qt_bucket=noqt
          else
            case "${{ inputs.qt-version }}" in
              6.*) qt_bucket=qt6 ;;
              5.*) qt_bucket=qt5 ;;
              "") qt_bucket=qt5-system ;;
              *) qt_bucket=$(echo "${{ inputs.qt-version }}" | tr -c 'a-zA-Z0-9' '-') ;;
            esac
          fi
          key="superbuild-ext-v5-${{ runner.os }}-${qt_bucket}-py${{ inputs.build-with-python }}-ospray${{ inputs.with-ospray }}-${{ hashFiles('Superbuild/*.cmake') }}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Externals cache key: $key"

      - name: Restore Superbuild externals cache
        if: ${{ inputs.cache-externals }}
        id: restore-ext-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bin/Externals/Build
            bin/Externals/Install
            bin/Externals/Stamp
            bin/Externals/Download
            bin/Externals/Source/Boost_external/stage/lib
            bin/Externals/Source/Zlib_external
            bin/Externals/Source/SQLite_external
            bin/Externals/Source/Teem_external
            bin/Externals/Source/Freetype_external
            bin/Externals/Source/Cleaver2_external
            bin/Externals/Source/GLM_external
            bin/Externals/Source/Eigen_external
            bin/Externals/Source/SpdLog_external
            bin/Externals/Source/LodePng_external
            bin/Externals/Source/Tny_external
            bin/Externals/Source/Qwt_external
          key: ${{ steps.ext-key.outputs.key }}

      # CMake's ExternalProject steps are gated by comparing each stamp file's
      # mtime against freshly-regenerated files under Externals/tmp/ (rewritten
      # on every configure). A tar-based cache restore sets every file's mtime
      # to extraction time, which is *older* than that fresh regenerate, so
      # without this every step looks stale and reruns. Future-dating makes
      # the stamps look done forever until the cache key itself changes (see
      # revert 431dd8246 / commit f47d0a37a, which had this right before the
      # Build/-only miss sank it).
      - name: Touch cached externals stamps to the future
        if: ${{ inputs.cache-externals && steps.restore-ext-cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          echo "Restored externals cache (key: ${{ steps.ext-key.outputs.key }})"
          du -sh bin/Externals/* 2>/dev/null || true
          find bin/Externals/Stamp -type f -exec touch -d "2100-01-01" {} \;

      - name: Install Qt (if requested)
        if: ${{ inputs.qt-version != '' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt-version }}
          setup-python: 'true'
          install-deps: true

      - name: Print Qt dir
        run: echo "QT_ROOT_DIR=${QT_ROOT_DIR:-(unset)}"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Checkout SCIRunTestData
        if: ${{ inputs.run-regression-tests || inputs.coverage }}
        uses: actions/checkout@v6
        with:
          repository: CIBC-Internal/SCIRunTestData
          path: SCIRunTestData

      - name: Prepare (linux)
        if: ${{ startsWith(inputs.runner, 'ubuntu') || inputs.prepare-packages }}
        # apt's idle timeout never fires on a mirror that dribbles bytes, so bound
        # the step too. A good run is ~4 min.
        timeout-minutes: 20
        # Two apt calls, not one: apt-get installs nothing at all if any single
        # package in the list is unavailable, so with everything in one command a
        # Qt5 package dropped from a newer Ubuntu also silently takes out mesa,
        # ninja and xorg-dev -- and `|| true` hides it until the build fails much
        # later on something unrelated. Qt5 is EOL upstream and on its way out of
        # the archive, so keep it in its own best-effort call. The Qt6 jobs get
        # Qt from install-qt-action and never needed this half anyway.
        run: |
          # Retry rather than fail: mirror stalls here are transient (#2731).
          apt_retry() {
            local i
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=3 \
                           -o Acquire::http::Timeout=30 \
                           -o Acquire::https::Timeout=30 "$@" && return 0
              echo "::warning::apt-get $1 failed (attempt $i of 3)"
              if [ "$i" -lt 3 ]; then sleep $((i * 15)); fi
            done
            return 1
          }
          apt_retry update
          apt_retry install -y mesa-common-dev libgl1-mesa-dev mesa-utils-extra libglapi-mesa ninja-build xorg-dev libglu1-mesa-dev \
            || echo "::warning::Base build dependencies failed to install; the build will probably fail."
          apt_retry install -y qt5-qmake qtbase5-dev libqt5opengl5-dev libqt5svg5-dev \
            || echo "::warning::apt Qt5 packages unavailable on this image; only the Qt5 GUI jobs need them."

      - name: Build (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        # No -j is passed on purpose: build.sh auto-detects a job count from the
        # runner's cores and RAM (see detect_parallel_jobs there) and echoes it,
        # so this stays correct across the 3-core arm64 images, the 4-core Intel
        # and Linux ones, and any self-hosted runner added later (#2617).
        # Before that detection existed these builds ran fully serial.
        run: |
          set -eux
          CMD=(./build.sh)
          CMD+=("-DCMAKE_C_COMPILER_LAUNCHER=sccache")
          CMD+=("-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")
          # Default ON deletes the generated factory sources after each build, so every
          # later `make` relinks up to SCIRun.app and re-runs its macdeployqt POST_BUILD
          # chain -- 4x in the mac package step. Only helps incremental local builds
          # pick up new .module files; CI is always clean. See #2664.
          CMD+=("-DREGENERATE_MODULE_FACTORY_CODE:BOOL=OFF")
          # Variant-specific flags
          if [ "${{ inputs.variant }}" = "gui" ]; then
            # Pass Qt path (from installer or explicit), and set SCIRUN_QT_MIN_VERSION appropriately
            if [ "${{ inputs.qt-version }}" != "" ]; then
              CMD+=("-DQt_PATH=\"${QT_ROOT_DIR}\"")
            elif [ "${{ inputs.qt-path }}" != "" ]; then
              CMD+=("-DQt_PATH=\"${{ inputs.qt-path }}\"")
            else
              # try to auto-detect on Debian/Ubuntu runners
              if command -v dpkg >/dev/null 2>&1; then
                QT_DET=$(dpkg -L qtbase5-dev 2>/dev/null | head -n 1 || true)
                if [ "${QT_DET}" != "" ]; then
                  CMD+=("-DQt_PATH=\"${QT_DET}\"")
                else
                  echo "Warning: qtbase5-dev files not found via dpkg"
                fi
              else
                echo "No Qt path provided and qt-version empty; proceeding without explicit Qt path"
              fi
            fi

            # Determine SCIRUN_QT_MIN_VERSION
            if [ "${{ inputs.scirun-qt-min-version }}" != "" ]; then
              CMD+=("-DSCIRUN_QT_MIN_VERSION=\"${{ inputs.scirun-qt-min-version }}\"")
            else
              if [ "${{ inputs.qt-version }}" != "" ]; then
                case "${{ inputs.qt-version }}" in
                  6.*) CMD+=("-DSCIRUN_QT_MIN_VERSION=\"6.3.1\"") ;;
                  5.*) CMD+=("-DSCIRUN_QT_MIN_VERSION=\"5.15.2\"") ;;
                  *) echo "Unknown qt-version format, not setting SCIRUN_QT_MIN_VERSION" ;;
                esac
              fi
            fi
          fi
          if [ "${{ inputs.variant }}" = "headless" ]; then
            CMD+=("-DWITH_GUI:BOOL=OFF")
          fi
          if [ "${{ inputs.build-with-python }}" = "false" ]; then
            CMD+=("-DWITH_PYTHON=OFF")
          fi
          if [ "${{ inputs.with-ospray }}" = "true" ]; then
            CMD+=("-DWITH_OSPRAY:BOOL=ON")
          fi
          if [ "${{ inputs.build-testing }}" = "true" ]; then
            CMD+=("-DBUILD_TESTING:BOOL=ON")
          fi
          if [ "${{ inputs.run-regression-tests }}" = "true" ] || [ "${{ inputs.coverage }}" = "true" ]; then
            CMD+=("-DSCIRUN_TEST_RESOURCE_DIR=${GITHUB_WORKSPACE}/SCIRunTestData")
          fi
          if [ "${{ inputs.coverage }}" = "true" ]; then
            # Debug build + Clang source-based coverage instrumentation.
            CMD+=("--debug" "-DENABLE_COVERAGE:BOOL=ON")
          fi
          # Join and run
          echo "Running: ${CMD[*]}"
          eval "${CMD[*]}"

      - name: Build (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Build arguments for cmake
          $cmakeArgs = @()
          $cmakeArgs += "-DCMAKE_C_COMPILER_LAUNCHER=sccache"
          $cmakeArgs += "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

          # As in the Linux/macOS step above: avoids a needless relink cascade. See #2664.
          $cmakeArgs += "-DREGENERATE_MODULE_FACTORY_CODE:BOOL=OFF"

          # Always use a Visual Studio generator on Windows to ensure MSVC flags are used.
          # The generator is an input (defaults to VS 2022) so the matrix can also build
          # with VS 2026 on the windows-2025 image.
          $cmakeArgs += '-G'
          $cmakeArgs += '${{ inputs.cmake-generator }}'
          $cmakeArgs += '-A'
          $cmakeArgs += 'x64'

          if ('${{ inputs.variant }}' -eq 'gui') {
            if ('${{ inputs.qt-version }}' -ne '') {
              $qtPath = $env:QT_ROOT_DIR
              if (-not $qtPath) { $qtPath = $env:Qt5_Dir }
              if (-not $qtPath) { $qtPath = $env:Qt6_Dir }
              if ($qtPath) { $cmakeArgs += "-DQt_PATH=$qtPath" } else { Write-Host "Warning: Qt installer ran but QT path not found in env" }

              if ('${{ inputs.scirun-qt-min-version }}' -ne '') {
                $cmakeArgs += "-DSCIRUN_QT_MIN_VERSION=${{ inputs.scirun-qt-min-version }}"
              } else {
                if ('${{ inputs.qt-version }}' -like '6.*') { $cmakeArgs += "-DSCIRUN_QT_MIN_VERSION=6.3.1" }
                elseif ('${{ inputs.qt-version }}' -like '5.*') { $cmakeArgs += "-DSCIRUN_QT_MIN_VERSION=5.15.2" }
              }
            } elseif ('${{ inputs.qt-path }}' -ne '') {
              $cmakeArgs += "-DQt_PATH=${{ inputs.qt-path }}"
            } else {
              Write-Host "No Qt path provided and qt-version empty; proceeding without explicit Qt path"
            }
          }

          if ('${{ inputs.variant }}' -eq 'headless') { $cmakeArgs += "-DWITH_GUI:BOOL=OFF" }
          if ('${{ inputs.build-with-python }}' -eq 'false') { $cmakeArgs += "-DWITH_PYTHON=OFF" }
          if ('${{ inputs.with-ospray }}' -eq 'true') { $cmakeArgs += "-DWITH_OSPRAY:BOOL=ON" }
          if ('${{ inputs.build-testing }}' -eq 'true') { $cmakeArgs += "-DBUILD_TESTING:BOOL=ON" }
          if ('${{ inputs.run-regression-tests }}' -eq 'true') { $cmakeArgs += "-DSCIRUN_TEST_RESOURCE_DIR=$env:GITHUB_WORKSPACE/SCIRunTestData" }

          # Prepare build directory (use bin/ to match build.ps1, build.sh, the
          # docs, and the Unix/macOS jobs — keeps the build tree identical across
          # platforms so the package/test/upload steps below share one path.)
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Push-Location bin

          # Run CMake configure
          $cmakeExe = 'cmake'
          $cmakeArgsFull = $cmakeArgs + @('-S','../Superbuild','-B','.')
          Write-Host "Configuring: $cmakeExe $($cmakeArgsFull -join ' ')"
          & $cmakeExe @cmakeArgsFull

          # Build (Release) using cmake --build
          Write-Host "Building with cmake --build . --config Release --parallel"
          & cmake --build . --config Release --parallel

          Pop-Location

      # Save-on-success only, and only when we didn't already restore this
      # exact key: an incomplete/broken build must never overwrite a good
      # cache, and there's nothing to save on a hit since content is identical.
      - name: Report externals directory sizes
        if: ${{ always() && inputs.cache-externals && runner.os != 'Windows' }}
        shell: bash
        # find | xargs instead of a du glob: du's own '*/' globs produced no
        # output at all here once (v3 run, job 107584798723) -- nullglob is
        # off, and if a pattern matched nothing early it apparently ate the
        # rest of the argument list under -e. -print0/xargs -0 can't do that.
        run: |
          du -sh bin/Externals 2>/dev/null || true
          find bin/Externals -mindepth 1 -maxdepth 1 -print0 2>/dev/null | xargs -0 du -sh 2>/dev/null || true
          find bin/Externals/Source -mindepth 1 -maxdepth 1 -print0 2>/dev/null | xargs -0 du -sh 2>/dev/null | sort -rh || true

      - name: Save Superbuild externals cache
        if: ${{ success() && inputs.cache-externals && runner.os != 'Windows' && steps.restore-ext-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            bin/Externals/Build
            bin/Externals/Install
            bin/Externals/Stamp
            bin/Externals/Download
            bin/Externals/Source/Boost_external/stage/lib
            bin/Externals/Source/Zlib_external
            bin/Externals/Source/SQLite_external
            bin/Externals/Source/Teem_external
            bin/Externals/Source/Freetype_external
            bin/Externals/Source/Cleaver2_external
            bin/Externals/Source/GLM_external
            bin/Externals/Source/Eigen_external
            bin/Externals/Source/SpdLog_external
            bin/Externals/Source/LodePng_external
            bin/Externals/Source/Tny_external
            bin/Externals/Source/Qwt_external
          key: ${{ steps.ext-key.outputs.key }}

      - name: Smoke test - executable loads and runs (Unix)
        if: ${{ inputs.run-smoke-test && runner.os != 'Windows' }}
        working-directory: bin/SCIRun
        # A successful build does NOT prove the binary can start. The dynamic loader
        # resolves linked libraries at load time, before main, so a reference to a
        # symbol the host OS lacks links cleanly and only aborts on execution.
        # Actually running the executable is what catches that class of failure;
        # --help suffices, because the loader has already resolved every dependency
        # by the time main runs, and --help routes to ConsoleApplication (see
        # src/Main/scirunMain.cc) so no window server is needed.
        #
        # Deliberately NO continue-on-error: unlike the test steps below, this step
        # must be able to fail the job, or it gates nothing.
        run: |
          set -eux
          # SCIRun_test is the unbundled executable, built on APPLE only
          # (src/Main/CMakeLists.txt); other platforms build SCIRun directly.
          if [ -x ./SCIRun_test ]; then
            APP=./SCIRun_test
          elif [ -x ./SCIRun ]; then
            APP=./SCIRun
          else
            echo "No SCIRun executable found in $(pwd)" >&2
            ls -la
            exit 1
          fi
          "$APP" --help

      - name: Package (optional - Unix/macOS)
        if: ${{ inputs.artifact-name != '' && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -eux
          if [ -d bin/SCIRun ]; then
            pushd bin/SCIRun
            cmake -DBUILD_BUNDLE:BOOL=ON ../../src || true
            make -j3 || true
            make package || true
            # Repair package script (present in older mac workflow)
            if [ -f repair_package.sh ]; then
              chmod +x repair_package.sh || true
              ./repair_package.sh || true
            fi
            popd
          else
            echo "bin/SCIRun not found; attempting in bin"
            if [ -d bin ]; then
              pushd bin
              cmake -DBUILD_BUNDLE:BOOL=ON ../src || true
              make -j3 || true
              make package || true
              popd
            else
              echo "No packaging directory found; skipping package step"
            fi
          fi

      - name: Package (optional - Windows)
        if: ${{ inputs.artifact-name != '' && runner.os == 'Windows' }}
        shell: cmd
        run: |
          if exist bin\SCIRun (
            pushd bin\SCIRun
            cmake --build . --config Release --target package || echo Package target failed or produced no packages
            popd
          ) else (
            pushd bin
            cmake --build . --config Release --target package || echo Package target failed or produced no packages
            popd
          )

      - name: Run unit tests (Unix)
        if: ${{ inputs.run-unit-tests && runner.os != 'Windows' }}
        working-directory: bin/SCIRun
        run: |
          ctest --output-on-failure --timeout 300 -j4 -E "\.Test\.ExampleNetwork\." \
            --output-junit "$GITHUB_WORKSPACE/junit-unit.xml" \
            2>&1 | tee /tmp/unit-test-results.txt
        continue-on-error: true

      - name: Run regression tests (Unix)
        if: ${{ inputs.run-regression-tests && runner.os != 'Windows' }}
        working-directory: bin/SCIRun
        run: |
          ctest --output-on-failure --timeout 300 -j3 -R "\.Test\.ExampleNetwork\." \
            --output-junit "$GITHUB_WORKSPACE/junit-regression.xml" \
            2>&1 | tee /tmp/regression-test-results.txt
        continue-on-error: true

      - name: Clean up per-process regression settings (Unix)
        if: ${{ inputs.run-regression-tests && runner.os != 'Windows' }}
        run: |
          # Each regression process isolates its QSettings under
          # SCIRun5_regression_<pid>; remove the stores left behind.
          rm -f "$HOME"/Library/Preferences/com.sci-cibc-software.SCIRun5_regression_*.plist 2>/dev/null || true
          rm -f "$HOME"/.config/"SCI:CIBC Software"/SCIRun5_regression_*.conf 2>/dev/null || true
        continue-on-error: true

      - name: Collect macOS crash reports
        if: ${{ (inputs.run-unit-tests || inputs.run-regression-tests) && runner.os == 'macOS' }}
        run: |
          # A test that dies on a signal reports only "Bus error" through ctest,
          # which is not enough to act on (#2700). macOS already writes a full
          # symbolicated .ips per crash; collect them so the nightly turns a
          # signal into a stack. ReportCrash writes asynchronously, so give the
          # last crash of the run a moment to land.
          sleep 10
          mkdir -p "$GITHUB_WORKSPACE/crash-reports"
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$d" ] && cp "$d"/SCIRun*.ips "$GITHUB_WORKSPACE/crash-reports/" 2>/dev/null
          done
          echo "collected $(ls -1 "$GITHUB_WORKSPACE/crash-reports" 2>/dev/null | wc -l) crash report(s)"
        continue-on-error: true

      - name: Run unit tests (Windows)
        if: ${{ inputs.run-unit-tests && runner.os == 'Windows' }}
        working-directory: bin/SCIRun
        shell: pwsh
        run: |
          ctest --output-on-failure --timeout 300 -j4 -C Release -E "\.Test\.ExampleNetwork\." `
            --output-junit "$env:GITHUB_WORKSPACE\junit-unit.xml" `
            2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\unit-test-results.txt"
        continue-on-error: true

      - name: Run regression tests (Windows)
        if: ${{ inputs.run-regression-tests && runner.os == 'Windows' }}
        working-directory: bin/SCIRun
        shell: pwsh
        run: |
          ctest --output-on-failure --timeout 300 -j3 -C Release -R "\.Test\.ExampleNetwork\." `
            --output-junit "$env:GITHUB_WORKSPACE\junit-regression.xml" `
            2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\regression-test-results.txt"
        continue-on-error: true

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always() && inputs.run-unit-tests
        with:
          name: "Unit Tests (${{ runner.os }} / ${{ inputs.variant }})"
          path: junit-unit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Publish regression test results
        uses: dorny/test-reporter@v1
        if: always() && inputs.run-regression-tests
        with:
          name: "Regression Tests (${{ runner.os }} / ${{ inputs.variant }})"
          path: junit-regression.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test logs (Unix)
        if: ${{ (inputs.run-unit-tests || inputs.run-regression-tests) && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ runner.os }}-${{ inputs.variant }}
          if-no-files-found: ignore
          path: |
            /tmp/unit-test-results.txt
            /tmp/regression-test-results.txt
            bin/SCIRun/Testing/Temporary/LastTest.log
            junit-unit.xml
            junit-regression.xml
            crash-reports/

      - name: Upload test logs (Windows)
        if: ${{ (inputs.run-unit-tests || inputs.run-regression-tests) && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ runner.os }}-${{ inputs.variant }}
          if-no-files-found: ignore
          path: |
            unit-test-results.txt
            regression-test-results.txt
            bin/SCIRun/Testing/Temporary/LastTest.log
            junit-unit.xml
            junit-regression.xml

      - name: Run tests + coverage report (macOS)
        if: ${{ inputs.coverage && runner.os == 'macOS' }}
        run: |
          # scripts/coverage.sh runs ctest with per-process profiling, merges
          # with llvm-profdata, and writes a text summary + HTML via llvm-cov.
          # No -R filter: cover both unit and regression tests.
          ./scripts/coverage.sh bin/SCIRun -- -j3 --timeout 300
        continue-on-error: true

      - name: Clean up per-process regression settings (coverage)
        if: ${{ inputs.coverage && runner.os == 'macOS' }}
        run: rm -f "$HOME"/Library/Preferences/com.sci-cibc-software.SCIRun5_regression_*.plist 2>/dev/null || true
        continue-on-error: true

      - name: Upload coverage report
        if: ${{ inputs.coverage && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ runner.os }}
          # `error`, not the default `warn`: the step above is continue-on-error
          # (tests legitimately fail), so a coverage.sh that produced nothing
          # otherwise reports success and silently uploads no artifact.
          if-no-files-found: error
          path: |
            bin/SCIRun/coverage/summary.txt
            bin/SCIRun/coverage/html

      # Runs after packaging so it can read the installed binary, and before the
      # upload so build-info.json travels inside the same artifact.
      - name: Record build environment and verify OS floor
        if: ${{ inputs.artifact-name != '' }}
        shell: bash
        # Nothing in this repo sets CMAKE_OSX_DEPLOYMENT_TARGET, so a macOS
        # binary's minimum OS is simply whichever runner image built it. Reading
        # LC_BUILD_VERSION back out of the packaged binary is the only way to
        # know what the installer actually runs on -- and that measured value is
        # what names the release asset and fills the table in the release notes.
        run: |
          set -eu
          # Git Bash on the Windows runners ships `python`, not `python3`.
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/ci/build_info.py \
            --build-dir bin/SCIRun \
            --artifact "${{ inputs.artifact-name }}" \
            --variant "${{ inputs.variant }}" \
            --runner-label "${{ inputs.runner }}" \
            --qt-version "${{ inputs.qt-version }}" \
            --generator "${{ inputs.cmake-generator }}" \
            --python "${{ inputs.build-with-python }}" \
            --max-os-floor "${{ inputs.max-os-floor }}"

      - name: Upload installer (optional)
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            bin/SCIRun/SCIRun-*-Darwin.pkg
            bin/SCIRun/SCIRun-*-win64.exe
            bin/SCIRun/build-info.json
            bin/**/*.msi

