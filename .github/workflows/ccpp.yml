name: linux-build

# Full linux matrix: master pushes, nightly, and on demand. Pull requests are
# covered by the slim tier in pr.yml -- see the comment at the top of that file
# for why no required check may live in a path-filtered workflow.

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  # event_name keeps schedule and master-push runs (same github.ref) from
  # cancelling each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cache-externals here is load-bearing, not just a speedup for this job:
  # pr.yml's cache-externals only ever restores from the *current* branch or
  # the *default* branch's own cache (GitHub Actions cache scoping), and
  # pr.yml never runs on master. Without a master-branch copy, every PR was
  # cold on its first push -- see #2780's post-merge follow-up. These three
  # jobs match pr.yml's linux-gui / linux-gui-qt6 / linux-unit-tests bucket
  # for bucket (same OS/arch/qt/python/ospray inputs the cache key is built
  # from), so a push to master keeps one shared cache warm that every PR
  # falls back to instead of each saving its own.
  linux-gui:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      qt-version: ''
      variant: gui
      build-with-python: true
      cache-externals: true

  # Qt6 on Linux x86_64 previously had no coverage outside pr.yml -- every
  # other Linux job here and on the arm64 runners below builds against Qt5.
  # Added alongside the cache-externals rollout for linux-gui/linux-headless
  # (see comment above); it happens to also be pr.yml's linux-gui-qt6's only
  # master-branch bucket match.
  linux-gui-qt6:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      qt-version: '6.3.*'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true
      cache-externals: true

  linux-headless:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: headless
      build-testing: true
      cache-externals: true

  linux-gui-nonpython:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: gui
      build-with-python: false

  linux-gui-ospray:
    if: false
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: gui
      with-ospray: true

  # arm64 (aarch64) coverage. GitHub-hosted Linux/arm64 runners
  # (ubuntu-24.04-arm) are free for public repositories. These mirror the x86_64
  # jobs above so the nightly/master matrix exercises the arm64 build path --
  # e.g. Boost library-name resolution, which is architecture-sensitive (#2583).
  linux-gui-arm:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-24.04-arm
      qt-version: ''
      variant: gui
      build-with-python: true

  linux-headless-arm:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-24.04-arm
      variant: headless
      build-testing: true

  linux-gui-nonpython-arm:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-24.04-arm
      variant: gui
      build-with-python: false

  # ---------------------------------------------------------------------------
  # Ubuntu 26.04 (public preview since 2026-06-11, actions/runner-images#14226).
  # New toolchain and new system libraries; ubuntu-latest stays 24.04 until GA,
  # so nothing above this line exercises 26.04.
  #
  # Same shape as the VS 2026 jobs in windows.yml: nightly-only, never in the PR
  # tier (pr.yml), and allow-failure so a preview-image break reports red without
  # failing the run. nightly-slack.yml names continue-on-error job failures
  # explicitly, so these still surface in Slack.
  #
  # ONE job on purpose, not a gui/headless/qt6 spread. 26.04 defaults to GCC
  # 15.2, and src/Externals/libxml2 is libxml2 2.6.22 (2005) built
  # unconditionally for every variant -- so today every variant dies in the same
  # place, and a spread would just buy three identical ~60-minute logs a night.
  # The Qt5-availability question a gui job would answer is already answered
  # cheaper: the `Prepare (linux)` step in reusable-build.yml runs its apt calls
  # on every ubuntu runner regardless of variant, and warns if apt Qt5 is gone.
  #
  # Once libxml2 compiles here, widen this to mirror the x86_64 trio above (and
  # ubuntu-26.04-arm, also in preview) -- at that point the variants diverge and
  # each earns its slot.
  # ---------------------------------------------------------------------------
  linux-2604-headless:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-26.04
      variant: headless
      build-testing: true
      allow-failure: true
