name: linux-build

# Full linux matrix: master pushes, nightly, and on demand. Pull requests are
# covered by the slim tier in pr.yml -- see the comment at the top of that file
# for why no required check may live in a path-filtered workflow.

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gui:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      qt-version: ''
      variant: gui
      build-with-python: true

  linux-headless:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: headless
      build-testing: true

  linux-gui-nonpython:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: gui
      build-with-python: false

  linux-gui-ospray:
    if: false
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: gui
      with-ospray: true

  # arm64 (aarch64) coverage. GitHub-hosted Linux/arm64 runners
  # (ubuntu-24.04-arm) are free for public repositories. These mirror the x86_64
  # jobs above so the nightly/master matrix exercises the arm64 build path --
  # e.g. the Boost PLATFORM_SUFFIX arch detection fixed in this branch (#2583).
  linux-gui-arm:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-24.04-arm
      qt-version: ''
      variant: gui
      build-with-python: true

  linux-headless-arm:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-24.04-arm
      variant: headless
      build-testing: true

  linux-gui-nonpython-arm:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-24.04-arm
      variant: gui
      build-with-python: false
