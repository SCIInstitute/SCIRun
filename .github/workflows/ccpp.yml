name: linux-build

# Full linux matrix: master pushes, nightly, and on demand. Pull requests are
# covered by the slim tier in pr.yml -- see the comment at the top of that file
# for why no required check may live in a path-filtered workflow.

on:
  push:
    branches:
      - master
      - superbuild-cache-staging  # STAGING-ONLY: exercise Superbuild cache (PR #2576); do not merge to master
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gui:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      qt-version: ''
      variant: gui
      build-with-python: true

  linux-headless:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: headless
      build-testing: true

  linux-gui-nonpython:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: gui
      build-with-python: false

  linux-gui-ospray:
    if: false
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: ubuntu-latest
      variant: gui
      with-ospray: true
