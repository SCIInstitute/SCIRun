name: Dependency version check

# Periodically checks the pinned external dependencies in
# Superbuild/VERSIONS.cmake against upstream, to enable proactive updates
# (SCIRun issue #2480). Two checks are performed by
# Superbuild/scripts/check_dependency_versions.py:
#   * DRIFT  — a tracked upstream branch has advanced past our pinned commit
#   * UPDATE — a newer upstream release/tag is available
#
# Report-only: the job never fails the pipeline. Results appear in the run
# summary, and (on the scheduled run) a single tracking issue is opened/updated.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    # Sanity-check the checker + manifest when either changes.
    paths:
      - "Superbuild/VERSIONS.cmake"
      - "Superbuild/scripts/check_dependency_versions.py"
      - ".github/workflows/dependency-check.yml"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run dependency check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # --no-fail: report-only, don't fail the pipeline.
          python3 Superbuild/scripts/check_dependency_versions.py --no-fail \
            | tee "$RUNNER_TEMP/dep-report.md"
          # Also expose whether anything is actionable (exit code w/o --no-fail).
          if python3 Superbuild/scripts/check_dependency_versions.py >/dev/null 2>&1; then
            echo "actionable=false" >> "$GITHUB_OUTPUT"
          else
            echo "actionable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish report to job summary
        if: always()
        run: cat "$RUNNER_TEMP/dep-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue
        # Only on the scheduled sweep, and only when something needs attention.
        if: github.event_name == 'schedule' && steps.check.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Dependency updates available"
          BODY_FILE="$RUNNER_TEMP/dep-report.md"
          {
            echo ""
            echo "---"
            echo "_Auto-generated by the \`Dependency version check\` workflow. "
            echo "Edit pins in \`Superbuild/VERSIONS.cmake\` — see "
            echo "\`docs/dev_doc/DependencyUpdates.md\`._"
          } >> "$BODY_FILE"

          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$BODY_FILE"
            gh issue comment "$existing" --body "Refreshed dependency report (see issue body)."
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
