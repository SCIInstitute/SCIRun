name: mac-build

# Full mac matrix: nightly and on demand. A master push runs only the jobs that
# publish installers or warm caches; the rest wait for the nightly. Non-python GUI,
# mac-intel-26 and the full headless jobs run Sundays only (the -slim ones stay daily). Pull requests are
# covered by the slim tier in pr.yml -- see the comment at the top of that file
# for why no required check may live in a path-filtered workflow.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '30 8 * * 1-6'
    - cron: '30 8 * * 0'
  workflow_dispatch:

concurrency:
  # event_name keeps schedule and master-push runs (same github.ref) from
  # cancelling each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # GUI builds
  # ---------------------------------------------------------------------------
  # WITH_VTK=ON (#2677); also warms the master VTK cache for pr.yml's VTK tier
  # (runner is part of the cache key). Skipped on release tags.
  mac-gui-vtk:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-latest
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true
      with-vtk: true
      timeout-minutes: 360

  # Also warms the sccache bucket PRs restore for mac-gui (runner label is not in
  # the cache key). macOS-latest drift is caught by mac-gui-nonpython.
  mac-gui-26:
    uses: ./.github/workflows/reusable-build.yml
    with:
      cache-compiler: true
      runner: macos-26
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true
      artifact-name: installer-macos-26-arm64
      max-os-floor: '14'

  mac-gui-26-intel:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * 0' }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macos-26-intel
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true
      artifact-name: installer-macos-26-intel
      max-os-floor: '14'

  # Floor-14 GUI build; the only mac installer most users can run. The macOS-14
  # runner image was retired 2026-11-02, so this builds on macOS-15 with
  # CMAKE_OSX_DEPLOYMENT_TARGET=14.0 (#2849); the minos check in reusable-build
  # proves the floor, but nothing executes on a real macOS 14 until the
  # self-hosted runner lands (#2857). It also keeps src/Interface compiled
  # against the lower target, the gap behind the quick_exit abort (#2564).
  mac-gui-14-arm:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-15
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true
      run-smoke-test: true
      artifact-name: installer-macos-14-arm64
      max-os-floor: '14'

  mac-gui-nonpython:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * 0' }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-latest
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: false
      artifact-name: installer-macos-26-arm64-nopython
      max-os-floor: '14'

  mac-gui-ospray:
    if: false
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-latest
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      with-ospray: true
      artifact-name: installer-macos-ospray

  # ---------------------------------------------------------------------------
  # Publish installers to a GitHub Release (issue #2398). Nightly on cron/master
  # push; a draft versioned release on a v* tag. Windows publishes to the same
  # releases from windows.yml. mac-gui-ospray is if:false, so it is not a dep.
  # ---------------------------------------------------------------------------
  publish-nightly:
    needs: [mac-gui-14-arm, mac-gui-26, mac-gui-26-intel, mac-gui-nonpython]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      channel: nightly

  publish-stable:
    needs: [mac-gui-14-arm, mac-gui-26, mac-gui-26-intel, mac-gui-nonpython]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      channel: stable

  # ---------------------------------------------------------------------------
  # Headless builds (with testing enabled)
  # ---------------------------------------------------------------------------
  mac-headless:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      cache-compiler: true
      runner: macOS-latest
      variant: headless
      build-testing: true
      run-smoke-test: true

  # No headless 14 jobs while 14 builds on 15: they would duplicate the 15-arm
  # ones below (floor-14 pin is global). Restore on the self-hosted runner (#2857).

  mac-headless-15-arm:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * 0' }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-15
      variant: headless
      build-testing: true
      run-smoke-test: true

  mac-headless-15-arm-slim:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-15
      variant: headless
      build-testing: true
      build-with-python: false
      run-unit-tests: true
      run-smoke-test: true

  mac-headless-15-intel:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * 0' }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-15-intel
      variant: headless
      build-testing: true
      run-smoke-test: true

  mac-headless-15-intel-slim:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-15-intel
      variant: headless
      build-testing: true
      build-with-python: false
      run-unit-tests: true
      run-smoke-test: true
