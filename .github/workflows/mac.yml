name: mac-build

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  # ---------------------------------------------------------------------------
  # GUI builds
  # ---------------------------------------------------------------------------
  mac-gui:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-latest
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunMacInstaller

  mac-gui-26:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macos-26
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunMacInstaller-26

  mac-gui-26-intel:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macos-26-intel
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: true
      artifact-name: SCIRunMacInstaller-26-intel

  mac-gui-nonpython:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-latest
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      build-with-python: false
      artifact-name: SCIRunMacNPInstaller

  mac-gui-ospray:
    if: false
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-latest
      qt-version: '6.10.2'
      scirun-qt-min-version: '6.3.1'
      variant: gui
      with-ospray: true
      artifact-name: SCIRunMacOsprayInstaller

  # ---------------------------------------------------------------------------
  # Headless builds (with testing enabled)
  # ---------------------------------------------------------------------------
  mac-headless:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-latest
      variant: headless
      build-testing: true

  mac-headless-14-arm:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-14
      variant: headless
      build-testing: true

  mac-headless-14-arm-slim:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-14
      variant: headless
      build-testing: true
      build-with-python: false
      run-unit-tests: true

  mac-headless-15-arm:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-15
      variant: headless
      build-testing: true

  mac-headless-15-arm-slim:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-15
      variant: headless
      build-testing: true
      build-with-python: false
      run-unit-tests: true

  mac-headless-15-intel:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-15-intel
      variant: headless
      build-testing: true

  mac-headless-15-intel-slim:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-15-intel
      variant: headless
      build-testing: true
      build-with-python: false
      run-unit-tests: true

  mac-headless-26:
    uses: ./.github/workflows/reusable-build.yml
    with:
      runner: macOS-26
      variant: headless
      build-testing: true
