name: nightly-slack

# Posts a per-workflow summary of each nightly run to Slack.
#
# Design notes:
#
#  * Triggered by `workflow_run`, not wired as a notify job inside each build
#    workflow. One file here replaces five near-identical notify jobs, and it
#    needs no `needs: [<every matrix job>]` list to learn the outcome -- the
#    workflow_run payload carries the conclusion directly. reusable-build.yml
#    (the tested build path) is left untouched.
#
#  * `workflow_run` only fires for workflow files that live on the DEFAULT
#    branch. This notifier therefore does nothing until it is merged to master,
#    and cannot be exercised from a PR branch. That is expected for nightly
#    infrastructure -- there is no way to unit-test a workflow_run trigger from a
#    feature branch.
#
#  * It reports the REAL ctest pass/fail counts, not just the job conclusion.
#    The ctest steps in reusable-build.yml carry `continue-on-error: true`, so
#    regression-tests reports "success" even when hundreds of cases fail. The
#    counts are recovered by downloading that run's `test-results-*` artifacts
#    and parsing the "N% tests passed, M tests failed out of K" summary lines.
#    A green job with failing tests is flagged yellow rather than green.
#
#  * Filtered to `event == 'schedule'`: only the nightly cron pings Slack. Master
#    pushes and workflow_dispatch runs do not (pushes still get GitHub's default
#    failure email). To also notify on-demand runs, add
#    `|| github.event.workflow_run.event == 'workflow_dispatch'` to the job `if`.
#
# Requires a repo secret SLACK_WEBHOOK_URL holding a Slack incoming-webhook URL
# (Settings -> Secrets and variables -> Actions). Until it is set, the workflow
# runs but skips the post with a warning.

on:
  workflow_run:
    workflows:
      - linux-build
      - windows-build
      - windows-build-script
      - mac-build
      - regression-tests
    types:
      - completed

permissions:
  actions: read      # download artifacts from, and read, the triggering run
  contents: read

jobs:
  notify:
    # Nightly cron only. workflow_run.event is the event that started the run
    # being reported, so this is 'schedule' for the nightly and 'push' for a
    # master build.
    if: ${{ github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download test-results artifacts (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
          WF_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          # Build-only workflows (linux-build, windows-build, windows-build-
          # script) upload no test artifacts; tolerate a no-match cleanly.
          gh run download "$WF_ID" \
            --repo "$REPO" \
            --dir artifacts \
            --pattern 'test-results-*' || true
          echo "Downloaded artifacts:"
          ls -R artifacts 2>/dev/null || echo "(none)"

      - name: Build Slack payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          short_sha="${WF_SHA:0:9}"

          # Collect ctest summary lines from any downloaded results files.
          # Filenames: unit-test-results.txt / regression-test-results.txt,
          # under a dir named test-results-<OS>-<variant>.
          test_lines=""
          any_fail=0
          shopt -s nullglob
          for f in artifacts/*/*-test-results.txt; do
            art="$(basename "$(dirname "$f")")"        # test-results-Linux-headless
            label="${art#test-results-}"               # Linux-headless
            kind="$(basename "$f")"; kind="${kind%%-test-results.txt}"   # unit | regression
            summary="$(grep -Eo '[0-9]+% tests passed, [0-9]+ tests failed out of [0-9]+' "$f" | tail -n1)"
            [ -z "$summary" ] && continue
            failed="$(printf '%s' "$summary" | grep -Eo '^[0-9]+% tests passed, [0-9]+' | grep -Eo '[0-9]+$')"
            [ "${failed:-0}" -gt 0 ] && any_fail=1
            test_lines="${test_lines}\n• ${label} ${kind}: ${summary}"
          done

          # Emoji: honor the real conclusion, but downgrade a green job to yellow
          # when its continue-on-error tests actually failed underneath.
          case "$WF_CONCLUSION" in
            success)   emoji=":large_green_circle:";;
            failure)   emoji=":red_circle:";;
            cancelled) emoji=":black_circle:";;
            *)         emoji=":white_circle:";;
          esac
          if [ "$any_fail" -eq 1 ] && [ "$WF_CONCLUSION" = "success" ]; then
            emoji=":large_yellow_circle:"
          fi

          # mac-build attaches its installers to the rolling `nightly` prerelease
          # (see mac.yml). Link it only when the tag actually moved to this run's
          # commit -- otherwise the nightly-release job failed and the link would
          # silently point at an older build.
          install_line=""
          if [ "$WF_NAME" = "mac-build" ]; then
            tag_sha="$(gh api "repos/${REPO}/git/ref/tags/nightly" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$tag_sha" = "$WF_SHA" ]; then
              install_line="\n:package: <https://github.com/${REPO}/releases/tag/nightly|macOS installers> (.pkg, unsigned)"
            fi
          fi

          header="${emoji} *${WF_NAME}* nightly — ${WF_CONCLUSION}"
          footer="<${WF_URL}|View run> · \`${short_sha}\` (${WF_BRANCH})"
          text="${header}${test_lines}${install_line}\n${footer}"

          # Build the JSON with jq so newlines and any special characters in the
          # summary are escaped correctly. printf %b expands the \n separators.
          jq -n --arg t "$(printf '%b' "$text")" '{text: $t}' > payload.json
          echo "Payload:"
          cat payload.json

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret is not set; skipping Slack post."
            exit 0
          fi
          curl -sSf -X POST -H 'Content-type: application/json' \
            --data @payload.json "$SLACK_WEBHOOK_URL"
